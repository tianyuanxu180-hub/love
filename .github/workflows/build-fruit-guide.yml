name: Build fruit preservation Word guide
on:
  push:
    paths:
      - 'fruit-preservation/README.md'
      - '.github/workflows/build-fruit-guide.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-docx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-docx
        run: pip install python-docx
      - name: Generate Word document
        run: |
          python - <<'PY'
          from docx import Document
          from docx.shared import Inches, Pt, RGBColor
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn
          from pathlib import Path
          import re
          src = Path('fruit-preservation/README.md').read_text(encoding='utf-8')
          doc = Document()
          sec = doc.sections[0]
          sec.top_margin = Inches(0.7); sec.bottom_margin = Inches(0.7)
          sec.left_margin = Inches(0.8); sec.right_margin = Inches(0.8)
          normal = doc.styles['Normal']
          normal.font.name = 'Arial'; normal.font.size = Pt(10.5)
          normal._element.rPr.rFonts.set(qn('w:eastAsia'), 'Microsoft YaHei')
          for name,size,color in [('Title',24,'1F4E79'),('Heading 1',17,'1F4E79'),('Heading 2',13,'2F5597'),('Heading 3',11,'2F5597')]:
              st=doc.styles[name]; st.font.name='Arial'; st.font.size=Pt(size); st.font.color.rgb=RGBColor.from_string(color)
              st._element.rPr.rFonts.set(qn('w:eastAsia'),'Microsoft YaHei')
          def add_rich(p, text):
              # Basic Markdown emphasis and inline-code handling.
              for token in re.split(r'(\*\*.*?\*\*|`.*?`)', text):
                  if not token: continue
                  if token.startswith('**') and token.endswith('**'):
                      p.add_run(token[2:-2]).bold=True
                  elif token.startswith('`') and token.endswith('`'):
                      r=p.add_run(token[1:-1]); r.font.name='Consolas'; r.font.size=Pt(9)
                  else: p.add_run(token)
          lines=src.splitlines(); i=0; first_title=True
          while i<len(lines):
              line=lines[i].strip()
              if not line: i+=1; continue
              if line.startswith('|') and i+1<len(lines) and lines[i+1].strip().startswith('|'):
                  raw=[]
                  while i<len(lines) and lines[i].strip().startswith('|'):
                      cells=[c.strip() for c in lines[i].strip().strip('|').split('|')]
                      if not all(re.fullmatch(r':?-{3,}:?',c or '-') for c in cells): raw.append(cells)
                      i+=1
                  if raw:
                      n=max(len(r) for r in raw); t=doc.add_table(rows=0, cols=n); t.style='Light Shading Accent 1'
                      for ri,row in enumerate(raw):
                          cells=t.add_row().cells
                          for ci in range(n):
                              cells[ci].text=''
                              add_rich(cells[ci].paragraphs[0], row[ci] if ci<len(row) else '')
                              if ri==0:
                                  for run in cells[ci].paragraphs[0].runs: run.bold=True
                  continue
              if line.startswith('# '):
                  title=line[2:].strip()
                  if first_title: doc.add_heading(title,0); first_title=False
                  else: doc.add_heading(title,1)
              elif line.startswith('## '): doc.add_heading(line[3:].strip(),2)
              elif line.startswith('### '): doc.add_heading(line[4:].strip(),3)
              elif line.startswith('- '):
                  p=doc.add_paragraph(style='List Bullet'); add_rich(p,line[2:])
              elif re.match(r'^\d+\. ',line):
                  p=doc.add_paragraph(style='List Number'); add_rich(p,re.sub(r'^\d+\. ','',line))
              elif line.startswith('> '):
                  p=doc.add_paragraph(style='Quote'); add_rich(p,line[2:])
              else:
                  p=doc.add_paragraph(); add_rich(p,line)
              i+=1
          out=Path('fruit-preservation/果蔬保鲜材料研究_研一组会准备手册.docx')
          doc.save(out)
          print(f'Created {out} ({out.stat().st_size} bytes)')
          PY
      - name: Commit generated Word document
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'fruit-preservation/果蔬保鲜材料研究_研一组会准备手册.docx'
          git commit -m 'Build downloadable fruit preservation Word guide' || echo 'No document changes to commit'
          git push
